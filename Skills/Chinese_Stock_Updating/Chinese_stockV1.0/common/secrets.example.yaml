# 飞书推送凭据模板
#
# 使用方法：复制本文件为 common/secrets.yaml 并填入真实值。
# secrets.yaml 已被 .gitignore 忽略，不会进入版本库。
#
# 也可以用环境变量覆盖（优先级更高）：
#   FEISHU_APP_ID / FEISHU_APP_SECRET / FEISHU_GROUP_ID / FEISHU_GROUP_ID_ALT

app_id: "cli_请填写"
app_secret: "请填写"
group_id: "oc_请填写（主推送群）"
# 可选：send_feishu.py 使用的备用群，不填则与 group_id 相同
group_id_alt: ""
