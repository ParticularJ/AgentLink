# 2026 年 10 月股票池（由用户提供的十月池整理为生产可消费的 watchlist 格式）
#
# 结构说明：
#   watchlist:  <sector_key>: {core: [...], focus: [...]}   ← 策略扫描 + 板块映射使用
#   etf_pool:   仅供记录与「ETF 池买入持有」基线，不进入个股策略扫描
#
# sector_key 一律使用 market_phase_detector.WATCHLIST_TO_SECTOR 中已登记的键，
# 因此无需改动任何生产代码即可直接用于回测/实盘。
#
# 整理过程中做的三处归一（详见 backtests/README.md）：
#   1. 船舶制造（600150 中国船舶）→ shipping_tanker：检测器没有「船舶制造」板块，
#      归入航运（同属交通运输/周期），属于近似映射；
#   2. 低空经济（600580/002085）→ low_altitude_economy：该键**未映射**到任何
#      检测器板块，因此这两只票在现行门控下会被判为 UNKNOWN 而无法开仓；
#   3. 药明生物（2269.HK）非 A 股，不在本池内（数据源与策略均只覆盖 A 股）。

