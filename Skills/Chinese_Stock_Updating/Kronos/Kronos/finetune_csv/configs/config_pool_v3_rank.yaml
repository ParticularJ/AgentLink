# Pool finetune config — 498-symbol watchlist pool (v3, 加 ranking loss)
# 优化目标:让 Kronos 学"5 日相对排序",直接对齐"哪只最差"
# 继承 v2 配置,加入 rank_loss_weight

data:
  data_path: "/data/AgentLink/Skills/Chinese_Stock_Updating/Kronos/Kronos/finetune_csv/data/pool_300.csv"
  lookback_window: 200
  predict_window: 5
  max_context: 200
  clip: 5.0
  train_ratio: 0.8
  val_ratio: 0.2
  test_ratio: 0.0

  pool_mode: true
  symbol_col: "symbol"
  level_weights:
    "S": 1.0
    "A": 1.0
    "B+": 1.0
    "压舱石": 1.0
    "": 1.0

training:
  tokenizer_epochs: 0  # 跳过 tokenizer,节省 1 小时(继承 v2 1 epoch 产物)
  basemodel_epochs: 1  # 1 epoch 验证 ranking 是否有效
  batch_size: 64
  log_interval: 100
  num_workers: 4
  seed: 42

  tokenizer_learning_rate: 0.00005
  predictor_learning_rate: 0.0000008

  # 方向损失(保持 v2 强度)
  dir_loss_weight: 0.3

  # 🔥 新增: ranking loss 权重
  # pairwise margin ranking loss 实测值范围 ~50~150
  # 用 0.001 让 ranking 占总 loss 的 5-15% (不淹没 CE 主任务)
  rank_loss_weight: 0.001

  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1

  accumulation_steps: 1

model_paths:
  pretrained_tokenizer: "NeoQuasar/Kronos-Tokenizer-base"
  pretrained_predictor: "NeoQuasar/Kronos-base"

  exp_name: "pool_300_daily_uniform_rank"
  base_path: "/data/AgentLink/Skills/Chinese_Stock_Updating/Kronos/Kronos/finetune_csv/finetuned/"

  base_save_path: ""
  finetuned_tokenizer: ""

  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

experiment:
  name: "kronos_pool_v3_rank"
  description: "Multi-symbol pool fine-tune with ranking loss for filter target"
  use_comet: false

  train_tokenizer: false
  train_basemodel: true

  skip_existing: false

device:
  use_cuda: true
  device_id: 0