# Pool finetune config — 498-symbol watchlist pool (v2, expanded from 133).
# 来源:
#   - 沪深 300 成分股 (300)
#   - 中证 500 独有 (200)
#   - 用户最近 6 个月推荐的去重 (83, 大部分已被 HS300/ZZ500 覆盖)
#   - 用户 133 池的 10 只独有
# 数据: 2020-01-02 → 2026-08-14,前复权 (qfq)
# 设计: path-X multi-symbol training, 均匀采样

data:
  data_path: "/data/AgentLink/Skills/Chinese_Stock_Updating/Kronos/Kronos/finetune_csv/data/pool_300.csv"
  lookback_window: 200
  predict_window: 5
  max_context: 200
  clip: 5.0
  train_ratio: 0.8
  val_ratio: 0.2
  test_ratio: 0.0

  # multi-symbol pool mode
  pool_mode: true
  symbol_col: "symbol"
  # 均匀采样(level 只是先验标签,不是训练时信号)
  level_weights:
    "S": 1.0
    "A": 1.0
    "B+": 1.0
    "压舱石": 1.0
    "": 1.0    # unmatched — neutral weight

training:
  tokenizer_epochs: 1
  basemodel_epochs: 1
  batch_size: 64
  log_interval: 50
  num_workers: 4
  seed: 42

  # 池子变大,降低学习率以稳定收敛
  tokenizer_learning_rate: 0.00005
  predictor_learning_rate: 0.0000008  # 从 1e-6 略降

  # Direction-loss weight (来自 8/12 实验)
  dir_loss_weight: 0.3

  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1

  accumulation_steps: 1

model_paths:
  pretrained_tokenizer: "NeoQuasar/Kronos-Tokenizer-base"
  pretrained_predictor: "NeoQuasar/Kronos-base"

  exp_name: "pool_300_daily_uniform"
  base_path: "/data/AgentLink/Skills/Chinese_Stock_Updating/Kronos/Kronos/finetune_csv/finetuned/"

  base_save_path: ""
  finetuned_tokenizer: ""

  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

experiment:
  name: "kronos_pool_v2_300"
  description: "Multi-symbol pool fine-tune on 498-symbol watchlist (path-X)"
  use_comet: false

  train_tokenizer: true
  train_basemodel: true

  skip_existing: false

device:
  use_cuda: true
  device_id: 0