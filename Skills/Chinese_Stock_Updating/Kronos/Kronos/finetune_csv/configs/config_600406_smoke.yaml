# Minimal smoke config to validate finetune_csv pipeline on 600406 daily bars.
# Not intended to produce a useful model — only to confirm the pipeline runs.

data:
  data_path: "/data/AgentLink/Skills/Chinese_Stock_Updating/Kronos/Kronos/finetune_csv/data/600406_daily.csv"
  lookback_window: 200
  predict_window: 5
  max_context: 200
  clip: 5.0
  train_ratio: 0.8
  val_ratio: 0.2
  test_ratio: 0.0

training:
  tokenizer_epochs: 30
  basemodel_epochs: 30
  batch_size: 32
  log_interval: 10
  num_workers: 2
  seed: 42

  tokenizer_learning_rate: 0.0002
  predictor_learning_rate: 0.000001

  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1

  accumulation_steps: 1

model_paths:
  pretrained_tokenizer: "NeoQuasar/Kronos-Tokenizer-base"
  pretrained_predictor: "NeoQuasar/Kronos-base"

  exp_name: "smoke_600406_daily"
  base_path: "/data/AgentLink/Skills/Chinese_Stock_Updating/Kronos/Kronos/finetune_csv/finetuned/"

  base_save_path: ""
  finetuned_tokenizer: ""

  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

experiment:
  name: "kronos_600406_smoke"
  description: "Pipeline-validation smoke run on 600406 daily bars"
  use_comet: false

  train_tokenizer: true
  train_basemodel: true

  skip_existing: false

device:
  use_cuda: true
  device_id: 0